name: Publish Repositories

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-rpm-repo:
    runs-on: ubuntu-latest
    name: Build RPM Repository

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          # Set ultimate trust for the imported key
          KEY_FPR=$(gpg --list-keys --with-colons | grep '^fpr' | head -n1 | cut -d: -f10)
          echo "${KEY_FPR}:6:" | gpg --import-ownertrust

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Download Release RPMs
        uses: robinraju/release-downloader@v1.9
        with:
          tag: ${{ github.event.release.tag_name }}
          fileName: "*.noarch.rpm"
          out-file-path: "rpm-packages"

      - name: Verify RPM Version
        id: verify-rpm
        run: |
          # Install rpm tools
          sudo apt-get update && sudo apt-get install -y rpm

          # Extract version from downloaded RPM
          RPM_FILE=$(ls rpm-packages/*.rpm | head -n1)
          RPM_VERSION=$(rpm -qp --queryformat '%{VERSION}' "$RPM_FILE")
          RPM_RELEASE=$(rpm -qp --queryformat '%{RELEASE}' "$RPM_FILE")
          RPM_FULL_VERSION="${RPM_VERSION}-${RPM_RELEASE}"

          echo "📦 Downloaded RPM: $(basename $RPM_FILE)"
          echo "📋 RPM Version: $RPM_VERSION"
          echo "📋 RPM Release: $RPM_RELEASE"
          echo "rpm_version=$RPM_VERSION" >> $GITHUB_OUTPUT
          echo "rpm_full_version=$RPM_FULL_VERSION" >> $GITHUB_OUTPUT

          # Validate version matches release tag (if triggered by release event)
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            EXPECTED_VERSION="${{ github.event.release.tag_name }}"
            if [ "$RPM_VERSION" != "$EXPECTED_VERSION" ]; then
              echo "❌ ERROR: Version mismatch!"
              echo "   Expected: $EXPECTED_VERSION"
              echo "   Got: $RPM_VERSION"
              exit 1
            fi
            echo "✅ Version verified: $RPM_VERSION matches release tag"
          fi

      - name: Generate RPM repository metadata
        run: |
          podman pull docker.io/library/fedora:latest
          podman run --rm \
            -v $PWD:/workspace \
            -w /workspace \
            docker.io/library/fedora:latest \
            bash -c "
              dnf -y install createrepo_c && \
              createrepo_c \
                --checksum=sha512 \
                --compress-type=zstd \
                --general-compress-type=zstd \
                rpm-packages
            "

      - name: Sign RPM repository
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          cd rpm-packages/repodata

          # Get Key ID dynamically
          KEY_ID=$(gpg --list-keys --with-colons | grep '^pub' | head -n1 | cut -d: -f5)

          # Sign repomd.xml with SHA-512 (2026 best practice)
          echo "$GPG_PASSPHRASE" | gpg --default-key $KEY_ID --batch --yes \
              --passphrase-fd 0 \
              --pinentry-mode loopback \
              --digest-algo SHA512 \
              --personal-digest-preferences SHA512 \
              --detach-sign --armor repomd.xml

          # Verify signature
          gpg --verify repomd.xml.asc repomd.xml

          cd ..

          # Copy public key for DNF (with conventional RPM key name)
          cp ../extras/tuxgrade-archive-keyring.gpg RPM-GPG-KEY-tuxgrade

          echo "✓ RPM repository signed with SHA-512"

      - name: Upload RPM repository artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-repo
          path: rpm-packages/

  build-deb-repo:
    runs-on: ubuntu-latest
    name: Build DEB Repository

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          # Set ultimate trust for the imported key
          KEY_FPR=$(gpg --list-keys --with-colons | grep '^fpr' | head -n1 | cut -d: -f10)
          echo "${KEY_FPR}:6:" | gpg --import-ownertrust

      - name: Download Release DEBs
        uses: robinraju/release-downloader@v1.9
        with:
          tag: ${{ github.event.release.tag_name }}
          fileName: "*.deb"
          out-file-path: "deb-packages"

      - name: Verify DEB Version
        id: verify-deb
        run: |
          # Extract version from downloaded DEB
          DEB_FILE=$(ls deb-packages/*.deb | head -n1)
          DEB_VERSION=$(dpkg-deb -f "$DEB_FILE" Version | cut -d'-' -f1)
          DEB_FULL_VERSION=$(dpkg-deb -f "$DEB_FILE" Version)

          echo "📦 Downloaded DEB: $(basename $DEB_FILE)"
          echo "📋 DEB Version: $DEB_VERSION"
          echo "📋 DEB Full Version: $DEB_FULL_VERSION"
          echo "deb_version=$DEB_VERSION" >> $GITHUB_OUTPUT
          echo "deb_full_version=$DEB_FULL_VERSION" >> $GITHUB_OUTPUT

          # Validate version matches release tag (if triggered by release event)
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            EXPECTED_VERSION="${{ github.event.release.tag_name }}"
            if [ "$DEB_VERSION" != "$EXPECTED_VERSION" ]; then
              echo "❌ ERROR: Version mismatch!"
              echo "   Expected: $EXPECTED_VERSION"
              echo "   Got: $DEB_VERSION"
              exit 1
            fi
            echo "✅ Version verified: $DEB_VERSION matches release tag"
          fi

      - name: Generate APT repository metadata
        run: |
          cd deb-packages

          # Generate package list (uncompressed and compressed)
          dpkg-scanpackages . /dev/null > Packages
          gzip -9c Packages > Packages.gz

          # Calculate checksums for Packages files
          MD5_PACKAGES=$(md5sum Packages | awk '{print $1}')
          MD5_PACKAGES_GZ=$(md5sum Packages.gz | awk '{print $1}')
          SHA256_PACKAGES=$(sha256sum Packages | awk '{print $1}')
          SHA256_PACKAGES_GZ=$(sha256sum Packages.gz | awk '{print $1}')
          SHA512_PACKAGES=$(sha512sum Packages | awk '{print $1}')
          SHA512_PACKAGES_GZ=$(sha512sum Packages.gz | awk '{print $1}')

          SIZE_PACKAGES=$(stat -c%s Packages)
          SIZE_PACKAGES_GZ=$(stat -c%s Packages.gz)

          # Create Release file with checksums
          cat > Release << EOF
          Origin: Tuxgrade
          Label: Tuxgrade
          Suite: stable
          Codename: stable
          Date: $(date -R -u)
          Architectures: all
          Components: main
          Description: Tuxgrade - Linux System Updater
          MD5Sum:
           ${MD5_PACKAGES} ${SIZE_PACKAGES} Packages
           ${MD5_PACKAGES_GZ} ${SIZE_PACKAGES_GZ} Packages.gz
          SHA256:
           ${SHA256_PACKAGES} ${SIZE_PACKAGES} Packages
           ${SHA256_PACKAGES_GZ} ${SIZE_PACKAGES_GZ} Packages.gz
          SHA512:
           ${SHA512_PACKAGES} ${SIZE_PACKAGES} Packages
           ${SHA512_PACKAGES_GZ} ${SIZE_PACKAGES_GZ} Packages.gz
          EOF

      - name: Sign DEB repository
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          cd deb-packages

          # Get Key ID dynamically
          KEY_ID=$(gpg --list-keys --with-colons | grep '^pub' | head -n1 | cut -d: -f5)

          # Create InRelease (clearsigned Release file - preferred by modern APT)
          echo "$GPG_PASSPHRASE" | gpg --default-key $KEY_ID --batch --yes \
              --passphrase-fd 0 \
              --pinentry-mode loopback \
              --digest-algo SHA512 \
              --personal-digest-preferences SHA512 \
              --clearsign --output InRelease Release

          # Create Release.gpg (detached signature - fallback for older APT)
          echo "$GPG_PASSPHRASE" | gpg --default-key $KEY_ID --batch --yes \
              --passphrase-fd 0 \
              --pinentry-mode loopback \
              --digest-algo SHA512 \
              --personal-digest-preferences SHA512 \
              --armor --detach-sign --output Release.gpg Release

          # Verify signatures
          gpg --verify InRelease
          gpg --verify Release.gpg Release

          # Copy public key for users
          cp ../extras/tuxgrade-archive-keyring.gpg .

          echo "✓ DEB repository signed with SHA-512"

      - name: Upload DEB repository artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-repo
          path: deb-packages/

  combine-and-deploy:
    needs: [build-rpm-repo, build-deb-repo]
    runs-on: ubuntu-latest
    name: Combine and Deploy to GitHub Pages
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Download RPM repository
        uses: actions/download-artifact@v4
        with:
          name: rpm-repo
          path: combined-repo/rpm

      - name: Download DEB repository
        uses: actions/download-artifact@v4
        with:
          name: deb-repo
          path: combined-repo/deb

      - name: Verify Repository Contents
        run: |
          echo "📦 RPM Packages:"
          ls -lh combined-repo/rpm/*.rpm || echo "No RPM packages found"

          echo ""
          echo "📦 DEB Packages:"
          ls -lh combined-repo/deb/*.deb || echo "No DEB packages found"

          # Install tools for version extraction
          sudo apt-get update && sudo apt-get install -y rpm

          # Extract and display versions
          if ls combined-repo/rpm/*.rpm 1> /dev/null 2>&1; then
            RPM_FILE=$(ls combined-repo/rpm/*.rpm | head -n1)
            RPM_VERSION=$(rpm -qp --queryformat '%{VERSION}' "$RPM_FILE")
            echo "rpm_version=$RPM_VERSION" >> $GITHUB_ENV
            echo "📋 RPM Version: $RPM_VERSION"
          fi

          if ls combined-repo/deb/*.deb 1> /dev/null 2>&1; then
            DEB_FILE=$(ls combined-repo/deb/*.deb | head -n1)
            DEB_VERSION=$(dpkg-deb -f "$DEB_FILE" Version | cut -d'-' -f1)
            echo "deb_version=$DEB_VERSION" >> $GITHUB_ENV
            echo "📋 DEB Version: $DEB_VERSION"
          fi

      - name: Create index page
        run: |
          cat > combined-repo/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <title>Tuxgrade Repository</title>
            <style>
              body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
              h1 { color: #333; }
              .repo { background: #f5f5f5; padding: 15px; margin: 20px 0; border-radius: 5px; }
              code { background: #e0e0e0; padding: 2px 6px; border-radius: 3px; }
            </style>
          </head>
          <body>
            <h1>Tuxgrade Package Repository</h1>
            <p>Automated system upgrade tool for multiple Linux distributions.</p>
            
            <div class="repo">
              <h2>Fedora / RHEL / Rocky / AlmaLinux</h2>
              <p>Add the repository:</p>
              <pre><code>sudo curl -o /etc/yum.repos.d/tuxgrade.repo https://raw.githubusercontent.com/Lineax17/tuxgrade/main/extras/tuxgrade.repo</code></pre>
              <p>Install tuxgrade:</p>
              <pre><code>sudo dnf install tuxgrade</code></pre>
            </div>
            
            <div class="repo">
              <h2>Debian / Ubuntu / Linux Mint</h2>
              <p>Add the repository:</p>
              <pre><code>sudo curl -o /etc/apt/sources.list.d/tuxgrade.list https://raw.githubusercontent.com/Lineax17/tuxgrade/main/extras/tuxgrade.list
          sudo apt update</code></pre>
              <p>Install tuxgrade:</p>
              <pre><code>sudo apt install tuxgrade</code></pre>
            </div>
            
            <p><a href="https://github.com/Lineax17/tuxgrade">GitHub Repository</a></p>
          </body>
          </html>
          EOF

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: combined-repo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment Summary
        run: |
          echo "# 🚀 Repository Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📦 Package Versions" >> $GITHUB_STEP_SUMMARY
          echo "- **RPM Version:** ${rpm_version:-unknown}" >> $GITHUB_STEP_SUMMARY
          echo "- **DEB Version:** ${deb_version:-unknown}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🔗 Repository URLs" >> $GITHUB_STEP_SUMMARY
          echo "- **RPM Repo:** https://Lineax17.github.io/tuxgrade/rpm/" >> $GITHUB_STEP_SUMMARY
          echo "- **DEB Repo:** https://Lineax17.github.io/tuxgrade/deb/" >> $GITHUB_STEP_SUMMARY
          echo "- **Repository Index:** https://Lineax17.github.io/tuxgrade/" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ✅ Verification" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "# Clear DNF cache and verify version" >> $GITHUB_STEP_SUMMARY
          echo "sudo dnf clean metadata && dnf repoquery --repofrompath=tuxgrade,https://Lineax17.github.io/tuxgrade/rpm/ tuxgrade" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# Clear APT cache and verify version" >> $GITHUB_STEP_SUMMARY
          echo "sudo apt update" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
